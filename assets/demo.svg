<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" role="img" aria-label="A new session a week later. The user asks, in Cantonese, which database was chosen for orders. memory_search returns the decision note about PostgreSQL 16 first, and a weaker match about a client quote second.">
<title>A new session a week later. The user asks, in Cantonese, which database was chosen for orders. memory_search returns the decision note about PostgreSQL 16 first, and a weaker match about a client quote second.</title>
<style>
  .bg{fill:#f6f8fa} .card{fill:#ffffff;stroke:#d0d7de} .t{fill:#1f2328} .m{fill:#656d76}
  .acc{fill:#0969da} .accl{stroke:#0969da;fill:none} .ok{fill:#1a7f37} .okbg{fill:#dafbe1} .okl{stroke:#1a7f37}
  .chip{fill:#eaeef2} .ub{fill:#0969da} .ubt{fill:#ffffff} .line{stroke:#8c959f;fill:none} .dim{opacity:.62}
  .arrow{fill:#8c959f}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117} .card{fill:#161b22;stroke:#30363d} .t{fill:#e6edf3} .m{fill:#8b949e}
    .acc{fill:#58a6ff} .accl{stroke:#58a6ff} .ok{fill:#3fb950} .okbg{fill:#12261e} .okl{stroke:#3fb950}
    .chip{fill:#21262d} .ub{fill:#1f6feb} .line{stroke:#6e7681} .arrow{fill:#6e7681}
  }
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK TC','PingFang HK','PingFang TC','Microsoft JhengHei',Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
</style>
<rect class="bg" width="820" height="330" rx="14"/>
<rect class="card" x="16" y="16" width="788" height="298" rx="12"/>
<circle cx="40" cy="40" r="6" fill="#ff5f57"/>
<circle cx="60" cy="40" r="6" fill="#febc2e"/>
<circle cx="80" cy="40" r="6" fill="#28c840"/>
<text class="m" x="410" y="45" font-size="13" text-anchor="middle">a new session, a week later</text>
<line class="line" x1="16" y1="62" x2="804" y2="62" stroke-opacity=".35"/>
<rect class="ub" x="530" y="78" width="250" height="42" rx="14"/>
<text class="ubt" x="550" y="105" font-size="16">我哋之前揀咗咩資料庫做訂單？</text>
<text class="m" x="780" y="138" font-size="12" text-anchor="end">which database did we pick for orders?</text>
<rect class="chip" x="40" y="158" width="132" height="24" rx="12"/>
<text class="mono acc" x="106" y="174" font-size="12.5" text-anchor="middle">memory_search</text>
<rect class="okbg okl" x="40" y="194" width="740" height="40" rx="9" stroke-width="1.4"/>
<text class="ok" x="58" y="219" font-size="12" font-weight="700">#1 decision</text>
<text class="t" x="170" y="219" font-size="14.5">決定：訂單服務改用 PostgreSQL 16，唔再用 MySQL，因為要用 JSONB 同分區表。</text>
<g class="dim"><rect class="chip" x="40" y="244" width="740" height="40" rx="9"/>
<text class="m" x="58" y="269" font-size="12" font-weight="700">#2 tech</text>
<text class="t" x="170" y="269" font-size="14.5">客戶 Acme 要求報價單用港幣，付款期 30 日。</text></g>
<text class="m" x="762" y="269" font-size="12" font-style="italic" text-anchor="end">weaker match</text>
</svg>
